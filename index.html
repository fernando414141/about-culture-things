<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>About Culture Things | Website Under Construction</title>
  <meta name="description" content="About Culture Things is currently updating its website. We'll be back soon with curated local experiences in Portugal.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#153b32">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #153b32;
      --cream: #f6f2e9;
      --text: #17352e;
      --muted: #68756f;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--cream);
      color: var(--text);
      font-family: "DM Sans", system-ui, sans-serif;
      text-align: center;
    }

    main {
      width: min(680px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand {
      margin: 0 0 72px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .04em;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 650px;
      font-family: "Newsreader", Georgia, serif;
      font-size: clamp(46px, 8vw, 76px);
      font-weight: 500;
      line-height: .98;
      letter-spacing: -.035em;
    }

    .copy {
      max-width: 520px;
      margin: 28px 0 34px;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 18px);
      line-height: 1.65;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border: 1px solid var(--green);
      border-radius: 999px;
      color: var(--cream);
      background: var(--green);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: transform .15s ease, opacity .15s ease;
    }

    .button.secondary {
      color: var(--green);
      background: transparent;
    }

    .button:hover { transform: translateY(-1px); opacity: .9; }

    footer {
      margin-top: 76px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 520px) {
      body { padding: 24px 20px; }
      .brand { margin-bottom: 54px; }
      .actions { width: 100%; }
      .button { width: 100%; }
      footer { margin-top: 54px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">About Culture Things</p>

    <p class="eyebrow">Something new is coming</p>
    <h1>We’re updating our website.</h1>
    <p class="copy">We’re preparing a better way to discover our local experiences in Portugal. In the meantime, you can still contact us directly.</p>

    <div class="actions">
      <a class="button" href="mailto:aboutculturethings@gmail.com">Contact us</a>
      <a class="button secondary" href="https://www.instagram.com/aboutculturethings/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </div>

    <footer>© 2026 About Culture Things · Portugal</footer>
  </main>
</body>
</html>
