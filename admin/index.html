<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Availability · About Culture Things</title><style>body{margin:0;background:#f5f7f6;color:#17372f;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:48px auto;padding:0 20px}.card{background:#fff;border:1px solid #dfe7e4;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(23,55,47,.08)}h1{margin:0 0 8px;font-size:30px}.muted{color:#61716c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}label{display:grid;gap:7px;font-weight:600}input,button{font:inherit;border-radius:12px}input{padding:12px;border:1px solid #cfdad6}button{border:0;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#173f35;color:#fff}.secondary{background:#e8efec;color:#17372f}.actions{display:flex;gap:10px;flex-wrap:wrap}.dates{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap}.pill{background:#eef3f1;border-radius:999px;padding:7px 10px;font-size:14px}.status{min-height:24px;margin-top:14px;font-weight:600}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{margin:20px auto}.card{padding:18px}}</style></head><body><main class="wrap"><section class="card"><h1>Availability</h1><p class="muted">Block days when About Culture Things is not accepting bookings. Normal bookings never close a date automatically.</p><label>Private access key<input id="password" type="password" autocomplete="current-password"></label><div class="grid"><label>From<input id="from" type="date"></label><label>To<input id="to" type="date"></label></div><div class="actions"><button class="primary" id="block">Block dates</button><button class="secondary" id="unblock">Unblock dates</button></div><p class="status" id="status"></p><h2>Blocked dates</h2><div class="dates" id="dates"><span class="muted">Loading…</span></div></section></main><script>const $=id=>document.getElementById(id),status=$('status'),datesEl=$('dates');$('password').value=sessionStorage.getItem('act-admin-password')||'';function range(a,b){if(!a)return[];b=b||a;const out=[],d=new Date(a+'T12:00:00Z'),end=new Date(b+'T12:00:00Z');if(d>end)return[];while(d<=end&&out.length<366){out.push(d.toISOString().slice(0,10));d.setUTCDate(d.getUTCDate()+1)}return out}function render(ds){datesEl.innerHTML=ds.length?ds.map(d=>`<span class="pill">${d}</span>`).join(''):'<span class="muted">No dates blocked.</span>'}async function load(){try{const r=await fetch('/api/availability',{cache:'no-store'}),d=await r.json();if(!d.storageConfigured){status.textContent='One-time storage setup is still required.'}render(d.blockedDates||[])}catch(e){status.textContent='Could not load availability.'}}async function update(action){const password=$('password').value,dates=range($('from').value,$('to').value);if(!password){status.textContent='Enter the private access key.';return}if(!dates.length){status.textContent='Choose a valid date or range.';return}sessionStorage.setItem('act-admin-password',password);status.textContent='Saving…';try{const r=await fetch('/api/availability',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':password},body:JSON.stringify({action,dates})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not save.');render(d.blockedDates||[]);status.textContent=action==='block'?'Dates blocked.':'Dates available again.'}catch(e){status.textContent=e.message}}$('block').onclick=()=>update('block');$('unblock').onclick=()=>update('unblock');load();</script></body></html>
